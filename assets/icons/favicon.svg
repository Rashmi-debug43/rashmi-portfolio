<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#65CFFF" />
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#65CFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#8B7CFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#080B16" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#080B16" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(180, 190, 255, 0.2)" stroke-width="1.5" />
  <!-- Glow background -->
  <circle cx="32" cy="32" r="24" fill="url(#center-glow)" opacity="0.6" />
  <!-- Celestial Orbits -->
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="url(#orbit-grad)" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(-30 32 32)" opacity="0.8" />
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="url(#orbit-grad)" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(30 32 32)" opacity="0.8" />
  <!-- Constellation Nodes -->
  <circle cx="32" cy="32" r="3.5" fill="#F3F5FF" />
  <circle cx="16" cy="23" r="2" fill="#8B7CFF" />
  <circle cx="48" cy="41" r="2" fill="#65CFFF" />
  <circle cx="20" cy="44" r="1.5" fill="#A6AEC7" />
  <circle cx="44" cy="20" r="1.5" fill="#F3F5FF" />
  <!-- Connecting Ray -->
  <line x1="16" y1="23" x2="32" y2="32" stroke="rgba(139, 124, 255, 0.4)" stroke-width="1" />
  <line x1="32" y1="32" x2="48" y2="41" stroke="rgba(101, 207, 255, 0.4)" stroke-width="1" />
</svg>
