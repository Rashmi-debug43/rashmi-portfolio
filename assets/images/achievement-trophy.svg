<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="trophy-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#65CFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trophy-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#FFD43F" />
      <stop offset="100%" stop-color="#E59B00" />
    </linearGradient>
    <linearGradient id="orbit-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#65CFFF" />
    </linearGradient>
  </defs>

  <!-- Glow Backdrop -->
  <circle cx="160" cy="150" r="140" fill="url(#trophy-glow)" />

  <!-- Outer Celestial Astrolabe Ring -->
  <circle cx="160" cy="150" r="125" stroke="rgba(180, 190, 255, 0.18)" stroke-width="1.2" stroke-dasharray="4 6" />
  <circle cx="160" cy="150" r="105" stroke="rgba(139, 124, 255, 0.25)" stroke-width="1" />

  <!-- Fine-line Laurel Leaves (Left Arc) -->
  <path d="M100 200 C80 170 80 120 115 80" stroke="url(#trophy-gold)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="90" cy="175" r="2.5" fill="#FFD43F" />
  <circle cx="83" cy="145" r="2.5" fill="#FFD43F" />
  <circle cx="88" cy="115" r="2.5" fill="#FFD43F" />
  <circle cx="102" cy="92" r="2.5" fill="#FFD43F" />

  <!-- Fine-line Laurel Leaves (Right Arc) -->
  <path d="M220 200 C240 170 240 120 205 80" stroke="url(#trophy-gold)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="230" cy="175" r="2.5" fill="#FFD43F" />
  <circle cx="237" cy="145" r="2.5" fill="#FFD43F" />
  <circle cx="232" cy="115" r="2.5" fill="#FFD43F" />
  <circle cx="218" cy="92" r="2.5" fill="#FFD43F" />

  <!-- Chalice / Fine-line Trophy Body -->
  <path d="M125 100 L195 100 C195 100 195 145 160 165 C125 145 125 100 125 100 Z" fill="#151D34" stroke="url(#trophy-gold)" stroke-width="2" />
  
  <!-- Trophy Handles -->
  <path d="M125 105 C100 105 100 135 128 140" stroke="url(#trophy-gold)" stroke-width="1.8" fill="none" />
  <path d="M195 105 C220 105 220 135 192 140" stroke="url(#trophy-gold)" stroke-width="1.8" fill="none" />

  <!-- Central Star of Hackathon Victory -->
  <polygon points="160,118 163,126 172,127 165,133 167,142 160,137 153,142 155,133 148,127 157,126" fill="url(#trophy-gold)" />

  <!-- Trophy Stem and Pedestal -->
  <line x1="160" y1="165" x2="160" y2="195" stroke="url(#trophy-gold)" stroke-width="2.5" />
  <ellipse cx="160" cy="195" rx="14" ry="4" fill="url(#trophy-gold)" />
  
  <!-- Tiered Pedestal Base -->
  <polygon points="135,220 185,220 195,245 125,245" fill="#101629" stroke="url(#trophy-gold)" stroke-width="1.5" />
  <rect x="115" y="245" width="90" height="12" rx="3" fill="#151D34" stroke="rgba(180, 190, 255, 0.4)" stroke-width="1.2" />

  <!-- Plaque Text -->
  <text x="160" y="236" text-anchor="middle" fill="#FFD43F" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1">FOSS HACK 2026</text>

  <!-- Orbital Ellipse Cutting Across -->
  <ellipse cx="160" cy="150" rx="90" ry="28" stroke="url(#orbit-accent)" stroke-width="1.5" stroke-dasharray="4 3" transform="rotate(-15 160 150)" />
  <circle cx="75" cy="165" r="3" fill="#65CFFF" />
  <circle cx="245" cy="135" r="3" fill="#8B7CFF" />

  <!-- Floating Sparkles -->
  <circle cx="160" cy="70" r="2.5" fill="#FFF2A3" />
  <line x1="160" y1="62" x2="160" y2="78" stroke="#FFF2A3" stroke-width="1" />
  <line x1="152" y1="70" x2="168" y2="70" stroke="#FFF2A3" stroke-width="1" />
</svg>
