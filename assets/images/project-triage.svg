<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="triage-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#080B16" />
    </linearGradient>
    <radialGradient id="triage-glow" cx="60%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#65CFFF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#8B7CFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pulse-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#65CFFF" />
      <stop offset="65%" stop-color="#F3F5FF" />
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#triage-bg)" />
  <rect width="600" height="340" fill="url(#triage-glow)" />

  <!-- Hospital Flow Coordinates Grid -->
  <g opacity="0.1" stroke="#8B7CFF" stroke-width="0.8">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="260" x2="600" y2="260" />
    <line x1="100" y1="0" x2="100" y2="340" stroke-dasharray="3 3" />
    <line x1="250" y1="0" x2="250" y2="340" stroke-dasharray="3 3" />
    <line x1="400" y1="0" x2="400" y2="340" stroke-dasharray="3 3" />
    <line x1="520" y1="0" x2="520" y2="340" stroke-dasharray="3 3" />
  </g>

  <!-- ECG Pulse / Dynamic Queue Waveform -->
  <path d="M40 180 L160 180 L180 150 L195 210 L215 110 L235 230 L250 170 L265 180 L350 180 L370 145 L385 205 L405 125 L420 220 L435 175 L450 180 L560 180" 
        stroke="url(#pulse-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Triage Priority Cards -->
  <!-- Level 1: Immediate Critical -->
  <g transform="translate(110, 60)">
    <rect width="110" height="60" rx="8" fill="#151D34" stroke="rgba(255, 107, 107, 0.6)" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#FF6B6B" />
    <text x="32" y="26" fill="#F3F5FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LEVEL 1</text>
    <text x="15" y="46" fill="#A6AEC7" font-family="monospace" font-size="9">IMMEDIATE</text>
  </g>

  <!-- Level 2: Urgent Prioritization -->
  <g transform="translate(245, 45)">
    <rect width="110" height="60" rx="8" fill="#151D34" stroke="rgba(255, 184, 77, 0.6)" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#FFB84D" />
    <text x="32" y="26" fill="#F3F5FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LEVEL 2</text>
    <text x="15" y="46" fill="#A6AEC7" font-family="monospace" font-size="9">URGENT CARE</text>
  </g>

  <!-- Level 3: Queue Managed -->
  <g transform="translate(380, 60)">
    <rect width="110" height="60" rx="8" fill="#151D34" stroke="rgba(101, 207, 255, 0.6)" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#65CFFF" />
    <text x="32" y="26" fill="#F3F5FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LEVEL 3</text>
    <text x="15" y="46" fill="#A6AEC7" font-family="monospace" font-size="9">OPTIMIZED</text>
  </g>

  <!-- Bottom Intelligent Queue Flow Indicator -->
  <g transform="translate(150, 260)">
    <rect width="300" height="34" rx="6" fill="#101629" stroke="rgba(101, 207, 255, 0.3)" stroke-width="1" />
    <circle cx="25" cy="17" r="4" fill="#8B7CFF" />
    <circle cx="75" cy="17" r="4" fill="#8B7CFF" opacity="0.7" />
    <circle cx="125" cy="17" r="4" fill="#65CFFF" />
    <circle cx="175" cy="17" r="4" fill="#65CFFF" />
    <circle cx="225" cy="17" r="4" fill="#F3F5FF" />
    <circle cx="275" cy="17" r="4" fill="#FF6B6B" />
    <path d="M30 17 L70 17 M80 17 L120 17 M130 17 L170 17 M180 17 L220 17 M230 17 L270 17" stroke="rgba(180, 190, 255, 0.2)" stroke-width="1" stroke-dasharray="2 2" />
  </g>

  <text x="300" y="315" text-anchor="middle" fill="#A6AEC7" font-family="monospace" font-size="9.5" letter-spacing="1.2">DYNAMIC PATIENT PRIORITIZATION ENGINE</text>

  <!-- Corner Tag -->
  <rect x="25" y="25" width="130" height="24" rx="4" fill="rgba(101, 207, 255, 0.12)" stroke="rgba(101, 207, 255, 0.3)" stroke-width="1" />
  <text x="35" y="41" fill="#65CFFF" font-family="monospace" font-size="9.5" letter-spacing="1">TRIAGEAI PIPELINE</text>
</svg>
